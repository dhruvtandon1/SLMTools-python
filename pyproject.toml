[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoganlab-slmtools"
version = "0.3.0"
description = "Python port of SLMTools.jl"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SLMTools contributors"}]
dependencies = [
  "numpy>=1.26.4",
  "Pillow>=10.0.0",
  "pyFFTW>=0.15.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
plot = ["matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
